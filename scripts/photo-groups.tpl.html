<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projektu grupas</title>
<style>
:root{--bg:#f6f2ec;--ink:#231f1b;--line:#ded4c6;--red:#8f3b2e}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"Avenir Next",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:18px;margin:0 12px 0 0}button,select,input,textarea{font:inherit}
button,select{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer}
label{display:flex;gap:6px;align-items:center}#stats{margin-left:auto;font-weight:600}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px;padding:20px}
.g{background:#fff;border:2px solid transparent;border-radius:12px;overflow:hidden}.g.off{opacity:.35}
.cover{width:100%;height:260px;object-fit:cover;display:block;cursor:zoom-in}
.thumbs{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}.thumbs div{position:relative}
.thumbs img{width:78px;height:58px;object-fit:cover;border-radius:6px;cursor:pointer;border:2px solid transparent;display:block}
.thumbs img.cv{border-color:var(--red)}.thumbs .x{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border:0;border-radius:4px;font-size:11px;padding:0 5px;cursor:pointer}
.thumbs div.gone img{opacity:.25}
.body{padding:10px 12px 14px;display:grid;gap:8px}.body input,.body textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fffdfa}
.body textarea{min-height:58px;resize:vertical}.row{display:flex;gap:10px;align-items:center;font-size:13px}.row .sp{margin-left:auto}
.tag{background:#efe8de;border-radius:6px;padding:1px 8px;font-size:12px}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}#lb img{max-width:96vw;max-height:96vh}
</style></head><body>
<header><h1>Projektu grupas</h1>
<label>Veids <select id="fType"><option value="">Visi</option></select></label>
<label>Rādīt <select id="fShow"><option value="all">Visas grupas</option><option value="multi">Tikai ar vairākām bildēm</option><option value="single">Tikai atsevišķās bildes</option></select></label>
<button id="exp">Eksportēt grupas</button><span id="stats"></span></header>
<main id="grid"></main><div id="lb"><img alt=""></div>
<script>
const G=__DATA__,KEY='lm-groups-edits';let ed={};try{ed=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const TN={virtuve:'Virtuve',skapis:'Skapis',prieksnams:'Priekšnams',vannasistaba:'Vannasistaba',viesistaba:'Viesistaba',cita:'Cita'};
const $=s=>document.querySelector(s);const fT=$('#fType');
Object.keys(TN).forEach(t=>fT.insertAdjacentHTML('beforeend',`<option value="${t}">${TN[t]}</option>`));
const E=g=>ed[g.id]||(ed[g.id]={});const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(ed))}catch(e){}};
const th=n=>`thumbs/${String(n).padStart(3,'0')}.jpg`;
function render(){const g=$('#grid');g.innerHTML='';let c=0;
G.filter(x=>(!fT.value||(E(x).type||x.type)===fT.value)&&($('#fShow').value==='all'||($('#fShow').value==='multi')===(x.images.length>1))).forEach(x=>{c++;const e=E(x),cover=e.cover||x.cover,gone=e.gone||[],el=document.createElement('div');el.className='g'+(e.off?' off':'');
 el.innerHTML=`<img class="cover" src="${th(cover)}" alt=""><div class="thumbs">${x.images.map(n=>`<div class="${gone.includes(n)?'gone':''}"><img class="${n===cover?'cv':''}" data-n="${n}" src="${th(n)}" alt="" title="Klikšķis: titulbilde"><button class="x" data-x="${n}">${gone.includes(n)?'+':'×'}</button></div>`).join('')}</div>
 <div class="body"><input class="t" value="${(e.title??x.title).replace(/"/g,'&quot;')}"><textarea class="d">${e.desc??x.desc}</textarea>
 <div class="row"><select class="ty">${Object.keys(TN).map(k=>`<option value="${k}" ${(e.type||x.type)===k?'selected':''}>${TN[k]}</option>`).join('')}</select><span class="tag">${x.images.length} bild.</span><label class="sp"><input type="checkbox" class="off" ${e.off?'checked':''}> Neizmantot</label></div></div>`;
 el.querySelector('.cover').onclick=()=>{ $('#lb img').src='../source-photos/'+encodeURIComponent(x.files[cover]);$('#lb').style.display='flex'};
 el.querySelectorAll('.thumbs img').forEach(i=>i.onclick=()=>{E(x).cover=+i.dataset.n;sv();render()});
 el.querySelectorAll('.x').forEach(b=>b.onclick=()=>{const n=+b.dataset.x,a=E(x).gone||[];E(x).gone=a.includes(n)?a.filter(v=>v!==n):[...a,n];sv();render()});
 el.querySelector('.t').oninput=ev=>{E(x).title=ev.target.value;sv()};el.querySelector('.d').oninput=ev=>{E(x).desc=ev.target.value;sv()};
 el.querySelector('.ty').onchange=ev=>{E(x).type=ev.target.value;sv()};el.querySelector('.off').onchange=ev=>{E(x).off=ev.target.checked;sv();render()};g.appendChild(el)});
 $('#stats').textContent=`Rāda ${c} no ${G.length} grupām`}
$('#lb').onclick=()=>{$('#lb').style.display='none'};['fType','fShow'].forEach(i=>$('#'+i).onchange=render);
$('#exp').onclick=()=>{const out=G.filter(x=>!E(x).off).map(x=>{const e=E(x),gone=e.gone||[];const im=x.images.filter(n=>!gone.includes(n));return {type:e.type||x.type,title:e.title??x.title,desc:e.desc??x.desc,cover:im.includes(e.cover||x.cover)?(e.cover||x.cover):im[0],images:im.map(n=>({n,file:x.files[n]}))}}).filter(g=>g.images.length);
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:'application/json'}));a.download='projektu-grupas.json';a.click()};
render();
</script></body></html>
