<dialog id="cookie-settings" class="cookie-settings" aria-labelledby="cookie-settings-title">
  <div class="cookie-settings-heading">
    <h2 id="cookie-settings-title">Sīkdatņu iestatījumi</h2>
    <button type="button" class="cookie-close" data-cookie-close>Aizvērt iestatījumus</button>
  </div>
  <p>Jūsu izvēli saglabājam šajā pārlūkā līdz 180 dienām.</p>
  <div class="cookie-option">
    <h3>Karte kontaktu lapā</h3>
    <p>Google kartē varat apskatīt, kur atrodamies. Ja izvēlaties rādīt karti, Google saņem jūsu IP adresi un var izmantot sīkdatnes.</p>
    <p data-cookie-allowed hidden>Karte tiks rādīta kontaktu lapā.</p>
    <p data-cookie-blocked>Karte ir paslēpta.</p>
  </div>
  <div class="cookie-actions">
    <button class="nk-button nk-button-outline" type="button" data-cookie-choice="reject">Nerādīt karti</button>
    <button class="nk-button nk-button-outline" type="button" data-cookie-choice="allow">Rādīt karti</button>
  </div>
  <a class="nk-link" href="/privatuma-politika/#sikdatnes">Privātuma politika</a>
</dialog>
